# Publica la imagen base (sin Claude Code) en ghcr.io/paso1studio/sbx-base.
# No corre con cada push: solo al crear un tag v* (por ejemplo v0.1.0) o a mano desde Actions.
name: publicar imagen base

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/paso1studio/sbx-base

jobs:
  base:
    # Solo publica desde un tag v* o desde main: un workflow_dispatch lanzado desde otra rama
    # no mueve las etiquetas :alpine y :ubuntu.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: alpine
            from: alpine:3.22
          - os: ubuntu
            from: ubuntu:24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas (alpine, alpine-v0.1.0, ...)
        id: tags
        run: |
          t="${IMAGEN}:${{ matrix.os }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then t="$t,${IMAGEN}:${{ matrix.os }}-${GITHUB_REF_NAME}"; fi
          echo "lista=$t" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: sandbox/base
          target: base
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ matrix.from }}
            TZ=UTC
          tags: ${{ steps.tags.outputs.lista }}
          push: true
