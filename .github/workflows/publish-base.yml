# Publica la imagen base (sin Claude Code) en ghcr.io/paso1studio/sbx-base.
# No corre con cada push: solo al crear un tag v* (por ejemplo v0.1.0) o a mano desde Actions.
name: publicar imagen base

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/paso1studio/sbx-base

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: alpine
            from: alpine:3.22
          - os: ubuntu
            from: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas (alpine, alpine-v0.1.0, ...)
        id: tags
        run: |
          t="${IMAGEN}:${{ matrix.os }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then t="$t,${IMAGEN}:${{ matrix.os }}-${GITHUB_REF_NAME}"; fi
          echo "lista=$t" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: sandbox/base
          target: base
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ matrix.from }}
            TZ=UTC
          tags: ${{ steps.tags.outputs.lista }}
          push: true
