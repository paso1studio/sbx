# Publica la imagen base (sin Claude Code) en ghcr.io/paso1studio/sbx-base.
# No corre con cada push: solo al crear un tag v* (por ejemplo v0.1.0) o a mano desde Actions.
name: publicar imagen base

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/paso1studio/sbx-base

jobs:
  base:
    # Solo publica desde un tag v* o desde main: un workflow_dispatch lanzado desde otra rama
    # no mueve las etiquetas :alpine y :ubuntu.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: alpine
            from: alpine:3.22
          - os: ubuntu
            from: ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas (alpine, alpine-v0.1.0, ...)
        id: tags
        run: |
          t="${IMAGEN}:${{ matrix.os }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then t="$t,${IMAGEN}:${{ matrix.os }}-${GITHUB_REF_NAME}"; fi
          echo "lista=$t" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox/base
          target: base
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ matrix.from }}
            TZ=UTC
          tags: ${{ steps.tags.outputs.lista }}
          push: true
