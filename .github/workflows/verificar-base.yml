# Construye la imagen base en los pull requests, sin publicar nada: sirve para probar cambios en
# el Dockerfile y las subidas de versión de las acciones (Dependabot) antes de aceptarlas.
# No tiene permisos de escritura, no inicia sesión en el registry y usa push: false.
name: verificar imagen base

on:
  pull_request:
    paths:
      - "sandbox/base/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: verificar-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: alpine
            from: alpine:3.22
          - os: ubuntu
            from: ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox/base
          target: base
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ matrix.from }}
            TZ=UTC
          push: false
