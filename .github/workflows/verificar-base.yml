# Construye la imagen base en los pull requests, sin publicar nada: sirve para probar cambios en
# el Dockerfile y las subidas de versión de las acciones (Dependabot) antes de aceptarlas.
# No tiene permisos de escritura, no inicia sesión en el registry y usa push: false.
name: verificar imagen base

on:
  pull_request:
    paths:
      - "sandbox/base/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: verificar-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: alpine
            from: alpine:3.22
          - os: ubuntu
            from: ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox/base
          target: base
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ matrix.from }}
            TZ=UTC
          push: false
